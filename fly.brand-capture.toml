# fly.toml app configuration file generated for declineguard-brand-capture on 2026-10-03T01:28:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'declineguard-brand-capture'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile.brand-capture'

[env]
  NODE_ENV = 'production'
  PORT = '8787'
  REQUIRE_SECRET = '1'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024

# Fly.io config for the Playwright brand-capture worker.
# Deploy from repo root:
#   fly deploy -c fly.brand-capture.toml --dockerfile Dockerfile.brand-capture

app = "declineguard-brand-capture"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.brand-capture"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  REQUIRE_SECRET = "1"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
  cpus = 2
